<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Social media meta tags for Facebook -->
    <meta property="og:title" content="StoreKeep | Dashboard " />
    <meta
      property="og:description"
      content="A decoupled Single Page Application (SPA) designed as easy to use dashboard for managing Shopify store datasets."
    />
    <meta
      property="og:image"
      content="https://github.com/Damilolaadefenwa/storeKeepwdd330/blob/main/src/public/images/socialmediapreviewimg.webp"
    />
    <meta
      property="og:url"
      content="https://damilolaadefenwa.github.io/storeKeepwdd330"
    />
    <!-- End Social media meta tags for Facebook -->
    <title>StoreKeep | Products Inventory</title>
    <meta
      name="description"
      content="Get the daily summary on your inventory/products you have in your Shopify Admin Store."
    />
    <meta name="author" content="Damilola Adefenwa" />
    <meta
      name="keywords"
      content="storekeeper, products, ecommerce management, shopify inventory, shopify dataset, vanilla Javascript, storekeep, inventory application, inventory dashboard "
    />

    <!-- Style Sheets -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Scripts -->
    <script src="./js/main.js" type="module"></script>

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" />

    <!-- Custom Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="app-container">
      <!-- HEADER -->
      <header id="header" class="main-header"></header>

      <!-- SIDEBAR -->
      <nav id="main-sidebar">
        <ul class="sidebar-nav" id="nav-list">
          <li class="sidebar-item">
            <a href="orders.html" class="sidebar-link" id="nav-orders"
              >Orders</a
            >
          </li>
          <li class="sidebar-item">
            <a href="products.html" class="sidebar-link" id="nav-product"
              >Products</a
            >
          </li>
          <li class="sidebar-item">
            <a href="siteplan.html" class="sidebar-link" id="nav-siteplan"
              >SitePlan</a
            >
          </li>
        </ul>
      </nav>

      <!-- MAIN CONTENT -->
      <main id="main-content" class="products-main">
        <div class="page-header">
          <h1>Product Inventory Dashboard</h1>
          <div class="inventory-summary-bar">
            <p>
              Total Units in Stock: <strong id="page-total-stock">0</strong>
            </p>
            <p>
              Total Catalog Value: <strong id="page-total-value">$0.00</strong>
            </p>
          </div>
        </div>

        <section class="table-container">
          <table class="data-table" id="products-table">
            <caption>
              Active Store Inventory
            </caption>
            <thead>
              <tr>
                <th>#</th>
                <th>Product Title</th>
                <th>Product Image</th>
                <th>Brand/Vendor</th>
                <th>Product Type</th>
                <th>Variant Details</th>
                <th>Color</th>
                <th>Quantity</th>
                <th>Price</th>
              </tr>
            </thead>
            <tbody id="products-table-body">
              <!-- Dynamic Rows Injected by JavaScript -->
            </tbody>
            <tfoot>
              <tr class="table-summary-row">
                <td colspan="7">Total Stock Value</td>
                <td id="table-total-quantity">0</td>
                <td id="table-total-value">$0.00</td>
              </tr>
            </tfoot>
          </table>
        </section>
      </main>

      <footer id="footer" class="main-footer"></footer>
    </div>
  </body>
</html>
