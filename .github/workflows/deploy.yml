name: Deploy StoreKeep to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages # Highlighted Fix: Tells GitHub Actions where to authorize deployment
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Updated to Node 22 to eliminate line 1 deprecation warning
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Build
        run: npm run build

      - name: Setup Pages Engine
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Deploys my built index.html from dist, ignoring the root README

      - name: Deploy to Live Site
        id: deployment
        uses: actions/deploy-pages@v4
