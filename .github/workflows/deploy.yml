name: Deploy StoreKeep to GitHub Pages

on:
  push:
    branches: [ main ] # Runs automatically when you push to main
  workflow_dispatch: # Allows you to manually trigger it via GitHub if needed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Build
        run: npm run build # Reads your /storeKeepwdd330/ base URL from vite.config.js

      - name: Setup Pages Engine
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to Live Site
        id: deployment
        uses: actions/deploy-pages@v4
